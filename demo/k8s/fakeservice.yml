apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service-chaos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
      - name: fake-service
        image: nicholasjackson/fake-service:vm-v0.26.2 
        ports:
        - containerPort: 9090
        env:
        # 90% of all requests will result in an error
        - name: ERROR_RATE
          value: "0.1"
        # Forces a full HTTP error rather than just a delay
        - name: ERROR_TYPE
          value: "http_error"
        # The specific error code to return
        - name: ERROR_CODE
          value: "503"
        # Injects a delay before the error triggers
        - name: ERROR_DELAY
          value: "2s"
        # Rate limit in req/second after which service returns an error code
        - name: RATE_LIMIT
          value: "5"
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
spec:
  selector:
    app: billing-service
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
